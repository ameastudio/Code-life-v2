<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#092f84">
  <meta name="description" content="Code Life — Where codes come to life.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Code Life">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preload" href="./entry-approved.webp" as="image" type="image/webp">
  <style>
/* Exact user-approved screenshot. Not a recreated lookalike. */
:root{color-scheme:dark;background:#061f62}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden}
body{min-height:100dvh;background:#072b7e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.screen{position:relative;width:min(100vw,calc(100dvh * 941 / 1672));height:100dvh;max-height:100dvh;margin:auto;overflow:hidden;isolation:isolate;background:#062978;box-shadow:0 0 38px #0008}
.approved-art{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;pointer-events:none;user-select:none;-webkit-user-drag:none}
/* The central illustrated button is at x=19..81% and y=86..94% in the source image.
   Coverage adapts to the typical extra horizontal crop on narrower phone screens. */
.art-button{position:absolute;z-index:2;display:block;border:0;padding:0;background:transparent;color:transparent;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.art-button:focus-visible{outline:3px solid #e7faff;outline-offset:2px;border-radius:999px;box-shadow:0 0 22px #62dbff}
.entry-button{top:85.5%;height:8.5%;width:72%;left:14%;border-radius:999px}
.back-button{left:1%;top:0;height:13%;width:12%;border-radius:50%}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (min-aspect-ratio:941/1672){.screen{width:calc(100dvh * 941 / 1672)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Screen 2: invisible, accessible controls precisely over Bri's original screenshot. */
.level-choice,.level-continue{position:absolute;z-index:3;display:block;padding:0;border:0;background:transparent;color:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.level-choice{left:8.5%;width:83%;border-radius:7% / 22%}
.level-choice[data-level="beginner"]{top:29.65%;height:13.7%}
.level-choice[data-level="intermediate"]{top:44.25%;height:13.45%}
.level-choice[data-level="advanced"]{top:58.1%;height:13.15%}
.level-choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #a5faffc9,0 0 14px #35ddffb3}
.level-choice:focus-visible,.level-continue:focus-visible{outline:3px solid #fff;outline-offset:2px}
.level-continue{left:37.1%;top:87.5%;width:56.2%;height:7.05%;border-radius:999px}
.screen-toast{position:absolute;z-index:5;left:13%;right:13%;top:76%;padding:12px 17px;text-align:center;font-weight:750;font-size:clamp(13px,4vw,18px);line-height:1.3;color:#fff;border:2px solid #92edff;border-radius:18px;background:linear-gradient(110deg,#053a96f2,#0568c2f2);box-shadow:0 0 22px #00ceffbf}


/* Surgical repair: only the malformed 2nd n in the original Beginner lettering.
   Image aligned to the source's 941×1672 cover crop, never changes the rest of the art. */
.beginner-letter-repair{position:absolute;z-index:1;pointer-events:none;left:calc(50% + 2.063397dvh);top:33.433014%;width:.717703dvh;height:1.136364dvh;object-fit:fill;user-select:none}

/* Screen 3 — original user-provided picture with real tap areas.
   The full original image ratio anchors buttons to the artwork even on narrow phones. */
.identity-controls{position:absolute;inset:0;z-index:3;pointer-events:none}
.identity-art-space{position:absolute;top:0;left:50%;transform:translateX(-50%);width:calc(100dvh * 941 / 1672);height:100%;pointer-events:none}
.identity-choice,.identity-continue{position:absolute;display:block;padding:0;border:0;background:transparent;color:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.identity-choice{border-radius:8% / 19%}
.identity-choice[data-identity="student"]{left:5.84%;top:30.50%;width:42.61%;height:11.26%}
.identity-choice[data-identity="self-taught"]{left:50.05%;top:30.50%;width:43.70%;height:11.26%}
.identity-choice[data-identity="career-switcher"]{left:5.84%;top:42.45%;width:42.61%;height:11.03%}
.identity-choice[data-identity="professional"]{left:50.05%;top:42.45%;width:43.70%;height:11.03%}
.identity-choice[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #9ffaffed,0 0 13px #24d9ffd4}
.identity-choice:focus-visible,.identity-continue:focus-visible{outline:3px solid #fff;outline-offset:2px}
.identity-continue{left:21.67%;top:88.64%;width:55.58%;height:7.05%;border-radius:999px}

</style>
  <title>Code Life</title>
</head>
<body>
  <main class="screen" id="screen" aria-label="Code Life">
    <img id="approved-screen" class="approved-art" src="./entry-approved.webp" alt="The approved Code Life entry screen: blue code icon, original Pixel Pup, neon city, and Get Started." fetchpriority="high">
    <img id="beginner-n-repair" class="beginner-letter-repair" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAATCAIAAAArl3v+AAABaklEQVR42oWRsWqUURSEvzn3bhKSwEJsRPAJLCzUhxDyGlY+k5WioJUgqGAtoqUQq0WyjUHZTTQku5v/v2csfkWDC051DmeYM8NolZ4e8eDRy2fP304OT6VtL87Rcn//zv17d2/fvLaz0erJgodPPzx+8v7oe+5euY6KktXy9MWbg/He1d2dzVs3xvXg0/Gr1++OzzY02r7oaNkDsKXR3mR68uXbDzOO2Wx2PJ+bDEXrs3V9a7Zx3y/Pz7ruIqRYrbqWPXbaaVApChFYfefWO1M1FIBJO/EwCRtKraOIAkQ67WYnAMKBAwICBxamOv0b4ADxD6KhZqeNNTBMmD9kizqIKwqSAQWhotqiqBQVRUS1ZRuwBMLA8NpJJrazSpIESAiZWOPp8iq0xni9dNcv7wJsPFjwGvH/vluPamEiJWtoBaAByiFrI2rd2qSOTEnC0hASjIgheSgm0/miy2Ylgr9qEYuew698/MxPFzvPCai/CnMAAAAASUVORK5CYII=" alt="" aria-hidden="true" hidden>
    <!-- The artwork is Bri's EXACT approved image, rather than a CSS approximation.
         A real, accessible tap target sits precisely over the illustrated CTA. -->
    <button id="get-started" class="art-button entry-button" type="button" aria-label="Get Started"></button>
    <button id="go-back" class="art-button back-button" type="button" aria-label="Back to Code Life entry screen" hidden></button>

    <div id="level-controls" hidden>
      <button class="level-choice" data-level="beginner" type="button" aria-label="Select Beginner" aria-pressed="false"></button>
      <button class="level-choice" data-level="intermediate" type="button" aria-label="Select Intermediate" aria-pressed="false"></button>
      <button class="level-choice" data-level="advanced" type="button" aria-label="Select Advanced" aria-pressed="false"></button>
      <button id="level-continue" class="level-continue" type="button" aria-label="Save coding level and Continue"></button>
    </div>

    <div id="identity-controls" class="identity-controls" hidden>
      <div class="identity-art-space">
        <button class="identity-choice" data-identity="student" type="button" aria-label="Student" aria-pressed="false"></button>
        <button class="identity-choice" data-identity="self-taught" type="button" aria-label="Self-taught learner" aria-pressed="false"></button>
        <button class="identity-choice" data-identity="career-switcher" type="button" aria-label="Career switcher" aria-pressed="false"></button>
        <button class="identity-choice" data-identity="professional" type="button" aria-label="Professional" aria-pressed="false"></button>
        <button id="identity-continue" class="identity-continue" type="button" aria-label="Save selection and Continue"></button>
      </div>
    </div>
    <div id="screen-toast" class="screen-toast" role="status" aria-live="polite" hidden></div>
    <span class="sr-only" aria-live="polite" id="screen-announcement"></span>
  </main>
  <script>
/* Code Life v2 screens 1–3. Every visual comes from Bri's approved image files. */
(()=>{
  'use strict';
  const LEVEL_KEY='code-life-v2:onboarding:level';
  const IDENTITY_KEY='code-life-v2:onboarding:identity';
  const LEVELS=new Set(['beginner','intermediate','advanced']);
  const IDENTITIES=new Set(['student','self-taught','career-switcher','professional']);
  const art=document.getElementById('approved-screen');
  const start=document.getElementById('get-started');
  const letterRepair=document.getElementById('beginner-n-repair');
  const back=document.getElementById('go-back');
  const levelControls=document.getElementById('level-controls');
  const levelChoices=[...document.querySelectorAll('.level-choice')];
  const levelContinue=document.getElementById('level-continue');
  const identityControls=document.getElementById('identity-controls');
  const identityChoices=[...document.querySelectorAll('.identity-choice')];
  const identityContinue=document.getElementById('identity-continue');
  const toast=document.getElementById('screen-toast');
  const msg=document.getElementById('screen-announcement');
  let chosenLevel='beginner';
  let chosenIdentity=null;
  let toastTimer;
  try {
    const savedLevel=localStorage.getItem(LEVEL_KEY);
    if(LEVELS.has(savedLevel))chosenLevel=savedLevel;
    const savedIdentity=localStorage.getItem(IDENTITY_KEY);
    if(IDENTITIES.has(savedIdentity))chosenIdentity=savedIdentity;
  } catch (_) {/* Local storage may be unavailable in private sessions. */}
  function niceIdentity(value){
    return ({
      'student':'Student',
      'self-taught':'Self-taught learner',
      'career-switcher':'Career switcher',
      'professional':'Professional'
    })[value]||'';
  }
  function announce(text){
    clearTimeout(toastTimer);
    toast.textContent=text;
    toast.hidden=false;
    toastTimer=setTimeout(()=>{toast.hidden=true;},2700);
  }
  function highlight(){
    levelChoices.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.level===chosenLevel)));
    identityChoices.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.identity===chosenIdentity)));
  }
  function render(){
    const isLevel=location.hash==='#/level';
    const isIdentity=location.hash==='#/identity';
    art.src=isIdentity?'./identity-approved.webp':isLevel?'./level-approved.webp':'./entry-approved.webp';
    art.alt=isIdentity
      ?'Original approved What describes you best screen: Student, Self-taught learner, Career switcher, Professional and Pixel Pup.'
      :isLevel
        ?'Original approved Choose your coding level screen: Beginner, Intermediate and Advanced, with Pixel Pup.'
        :'Original approved Code Life splash screen with its official logo, Pixel Pup, and Get Started.';
    start.hidden=isLevel||isIdentity;
    back.hidden=!(isLevel||isIdentity);
    levelControls.hidden=!isLevel;
    identityControls.hidden=!isIdentity;
    letterRepair.hidden=!isLevel;
    clearTimeout(toastTimer);
    toast.hidden=true;
    highlight();
    msg.textContent=isIdentity
      ?'What describes you best? '+(chosenIdentity?niceIdentity(chosenIdentity)+' is selected.':'Please select one option.')
      :isLevel
        ?'Choose your coding level. '+chosenLevel[0].toUpperCase()+chosenLevel.slice(1)+' is selected.'
        :'Welcome to Code Life.';
    document.title=isIdentity?'What Describes You Best? — Code Life':isLevel?'Choose Your Coding Level — Code Life':'Code Life';
  }
  levelChoices.forEach(button=>button.addEventListener('click',()=>{
    chosenLevel=button.dataset.level;
    highlight();
    msg.textContent=chosenLevel[0].toUpperCase()+chosenLevel.slice(1)+' selected.';
  }));
  levelContinue.addEventListener('click',()=>{
    try {localStorage.setItem(LEVEL_KEY,chosenLevel);}catch(_){announce('Please enable local storage to save your choice.');return;}
    location.hash='/identity';
  });
  identityChoices.forEach(button=>button.addEventListener('click',()=>{
    chosenIdentity=button.dataset.identity;
    highlight();
    msg.textContent=niceIdentity(chosenIdentity)+' selected.';
  }));
  identityContinue.addEventListener('click',()=>{
    if(!chosenIdentity){announce('Choose an option first.');return;}
    try {localStorage.setItem(IDENTITY_KEY,chosenIdentity);}catch(_){announce('Please enable local storage to save your choice.');return;}
    msg.textContent=niceIdentity(chosenIdentity)+' saved.';
    announce('Saved! Next: Choose Your Code Pet.');
    /* Screen 4 is intentionally not fabricated. Connect after its approved
       exact picture and functional six-pet selector are installed. */
  });
  start.addEventListener('click',()=>{location.hash='/level';});
  back.addEventListener('click',()=>{location.hash=location.hash==='#/identity'?'/level':'/';});
  addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
